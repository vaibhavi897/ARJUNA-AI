# Render blueprint for the FastAPI backend (free plan). Create it from the Render dashboard: New > Blueprint > pick this repo.
# Secrets marked sync: false are typed into the dashboard, never committed.
services:
  - type: web
    name: arjuna-api
    runtime: python
    rootDir: backend
    plan: free               # free tier: sleeps after 15 min idle, 512 MB RAM, no persistent disk (see docs/DEPLOYMENT.md)
    buildCommand: pip install -r requirements.txt
    # Bind the port straight away (Render fails the deploy if nothing listens in time) and run migrations alongside.
    # A failed migration is printed in the logs as MIGRATION FAILED instead of silently killing the service.
    startCommand: (python -m alembic upgrade head 2>&1 || echo "MIGRATION FAILED - see the lines above") & exec uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: ENVIRONMENT
        value: production
      - key: UPLOAD_DIR
        value: /tmp/uploads      # not persistent on the free plan; parsed resume data lives in the database
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false           # your Vercel address, for example https://arjuna-ai.vercel.app
      - key: GEMINI_API_KEY
        sync: false
      - key: SARVAM_API_KEY
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
